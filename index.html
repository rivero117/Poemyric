<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Poemyric</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        "Shuei KakuGo Gin",
        "A-OTF Shuei KakuGo Gin",
        "秀英角ゴシック銀",
        "Yu Gothic",
        "Yu Gothic Medium",
        "Hiragino Sans",
        "Hiragino Kaku Gothic ProN",
        "Noto Sans JP",
        sans-serif;
      background: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 1.5s ease;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 25px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #b3b3b3;
      margin-bottom: 40px;
      line-height: 1.8;
      letter-spacing: 0.06em;
    }

    .search-box {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="text"] {
      width: 100%;
      padding: 18px;
      border-radius: 30px;
      border: 1px solid #333;
      background: #242424;
      color: #fff;
      font-size: 1rem;
      outline: none;
      text-align: center;
      letter-spacing: 0.04em;
    }

    button {
      padding: 15px;
      border-radius: 30px;
      border: none;
      background: #fa2d48;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.08em;
    }

    button:hover {
      transform: scale(1.02);
      filter: brightness(1.08);
    }

    .loading {
      display: none;
      font-size: 1.1rem;
      margin-top: 20px;
      color: #ddd;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #fff;
      margin: 20px auto;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .result-view {
      display: none;
      margin-top: 10px;
      text-align: left;
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .music-card {
      background: rgba(0, 0, 0, 0.38);
      padding: 22px;
      border-radius: 24px;
      margin-bottom: 30px;
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: center;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.25);
    }

    .jacket-img {
      width: 190px;
      height: 190px;
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      margin-bottom: 16px;
      background: #333;
    }

    .song-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }

    .artist-name {
      font-size: 1rem;
      color: #c8c8c8;
      margin-bottom: 8px;
    }

    .album-name {
      font-size: 0.82rem;
      color: #999;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .music-review {
      font-size: 0.92rem;
      color: #e0e0e0;
      line-height: 1.8;
      text-align: left;
      letter-spacing: 0.04em;
    }

    .mood-badge {
      display: inline-block;
      margin: 16px auto 0;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
    }

    .lyrics-status {
      margin-top: 12px;
      font-size: 0.74rem;
      color: rgba(255, 255, 255, 0.58);
      line-height: 1.6;
      letter-spacing: 0.04em;
    }

    .music-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .music-actions a {
      display: block;
      text-align: center;
      padding: 12px;
      border-radius: 24px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      color: #fff;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      letter-spacing: 0.06em;
    }

    audio {
      width: 100%;
      margin-top: 16px;
    }

    .bridge-text {
      font-size: 0.95rem;
      font-weight: 500;
      text-align: center;
      color: rgba(255, 255, 255, 0.88);
      margin: 36px 0 20px;
      letter-spacing: 0.14em;
      line-height: 1.8;
    }

    .poem-card {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.76) 38%, rgba(245, 241, 235, 0.96) 100%);
      color: #2a2725;
      padding: 42px 27px 32px;
      border-radius: 30px;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.28),
        inset 0 0 0 1px rgba(255, 255, 255, 0.68);
      backdrop-filter: blur(18px);
    }

    .poem-card::before {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(90, 76, 68, 0.18);
      border-radius: 24px;
      pointer-events: none;
    }

    .poem-card::after {
      content: "ことば";
      position: absolute;
      right: 22px;
      top: 16px;
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      color: rgba(70, 60, 55, 0.24);
      writing-mode: vertical-rl;
    }

    .poem-body {
      position: relative;
      z-index: 1;
      font-size: 1.08rem;
      font-weight: 400;
      line-height: 2.5;
      letter-spacing: 0.14em;
      margin-bottom: 30px;
      white-space: pre-wrap;
      padding: 4px 18px 2px 18px;
      border-left: none;
      text-align: left;
    }

    .poem-body::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      width: 2px;
      height: calc(100% - 20px);
      background: linear-gradient(
        to bottom,
        rgba(80, 65, 58, 0),
        rgba(80, 65, 58, 0.42),
        rgba(80, 65, 58, 0)
      );
    }

    .poem-info {
      position: relative;
      z-index: 1;
      text-align: right;
      font-size: 0.78rem;
      color: rgba(42, 39, 37, 0.58);
      margin-bottom: 24px;
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    .poem-review-title {
      position: relative;
      z-index: 1;
      font-weight: 600;
      font-size: 0.86rem;
      color: rgba(42, 39, 37, 0.76);
      margin-bottom: 8px;
      border-top: 1px solid rgba(42, 39, 37, 0.12);
      padding-top: 18px;
      letter-spacing: 0.08em;
    }

    .poem-review {
      position: relative;
      z-index: 1;
      font-size: 0.82rem;
      color: rgba(42, 39, 37, 0.68);
      line-height: 1.9;
      letter-spacing: 0.05em;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.2);
      width: 100%;
      margin-top: 30px;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .error-text {
      color: #ffb3b3;
      font-size: 0.9rem;
      margin-top: 16px;
      line-height: 1.6;
      display: none;
    }

    .note {
      color: #888;
      font-size: 0.78rem;
      line-height: 1.6;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="main-ui">
      <h1>Poemyric</h1>
      <p class="subtitle">好きな音楽から、今の気持ちを表す詩を見つけよう</p>

      <div class="search-box">
        <input
          type="text"
          id="song-input"
          placeholder="例：Vaundy 踊り子 / 米津玄師 Lemon"
        />

        <button onclick="searchMusic()">キブンを見る</button>

        <p id="error-text" class="error-text"></p>

        <p class="note">
          iTunes Search APIとLRCLIBを使用。歌詞は判定だけに使い、上位ムードを表示します。
        </p>
      </div>
    </div>

    <div id="loading-ui" class="loading">
      <div class="spinner"></div>
      <p>曲と言葉の気配を探しています...</p>
    </div>

    <div id="result-ui" class="result-view">
      <div class="music-card">
        <img src="" id="music-jacket" class="jacket-img" alt="ジャケット画像" />

        <div class="song-title" id="res-song-title">曲名</div>
        <div class="artist-name" id="res-artist-name">アーティスト名</div>
        <div class="album-name" id="res-album-name">アルバム名</div>

        <div class="music-review" id="res-music-review">
          ここに曲の解釈が入ります。
        </div>

        <div class="mood-badge" id="mood-badge">mood</div>
        <div class="lyrics-status" id="lyrics-status">lyrics status</div>

        <audio id="preview-audio" controls></audio>

        <div class="music-actions">
          <a href="#" id="music-link" target="_blank" rel="noopener noreferrer">
            曲のページを開く
          </a>
        </div>
      </div>

      <div class="bridge-text">▼ そんな気分のあなたに、この言葉を。</div>

      <div class="poem-card">
        <div class="poem-body" id="res-poem-body">詩の本文</div>

        <div class="poem-info">
          <span id="res-poem-title">タイトル</span> /
          <span id="res-poem-author">作者</span>
        </div>

        <div class="poem-review-title">💡 言葉の案内</div>
        <div class="poem-review" id="res-poem-review">解説</div>
      </div>

      <button class="back-btn" onclick="resetApp()">もう一度探す</button>
    </div>
  </div>

  <script>
    const LASTFM_API_KEY = "c37a66a61e725531abc5f6ca1d991082"; // Last.fm APIキーをここに貼る。未設定でもアプリ自体は動きます。

    function addScoreByRules(scores, text, rules, multiplier) {
      const normalized = (text || "").toLowerCase();

      for (const rule of rules) {
        if (!(rule.mood in scores)) {
          scores[rule.mood] = 0;
        }

        for (const word of rule.words) {
          if (normalized.includes(word.toLowerCase())) {
            scores[rule.mood] += rule.weight * multiplier;
          }
        }
      }
    }

    function addScoreByLastFmTags(scores, tags, multiplier) {
      if (!tags || tags.length === 0) return;

      const tagText = tags
        .map((tag) => tag.name || tag)
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      for (const rule of getLastFmTagRules()) {
        if (!(rule.mood in scores)) {
          scores[rule.mood] = 0;
        }

        for (const tag of rule.tags) {
          if (tagText.includes(tag.toLowerCase())) {
            scores[rule.mood] += rule.weight * multiplier;
          }
        }
      }
    }

    function applyGeneralMoodCorrections(scores, sourceText) {
      const combined = (sourceText || "").toLowerCase();

      const brightMusicWords = [
        "あいうえお", "おんがく", "音楽", "うた", "歌", "リズム", "ラララ",
        "dance", "fun", "party", "children", "kids", "kawaii", "cute"
      ];

      const strongNegativeWords = [
        "絶望", "壊", "嫌い", "怖", "苦", "無理", "嘘", "痛",
        "broken", "pain", "hate", "dark", "depressing"
      ];

      const hasBrightMusic = brightMusicWords.some((word) => combined.includes(word));
      const hasStrongNegative = strongNegativeWords.some((word) => combined.includes(word));

      if (hasBrightMusic && !hasStrongNegative) {
        scores.playful += 8;
        scores.happy += 4;
        scores.healing += 2;
        scores.dark -= 5;
        scores.fragile -= 3;
        scores.lonely -= 3;
      }

      if (scores.happy > 0 && (scores.dark >= 6 || scores.fragile >= 6 || scores.lonely >= 6)) {
        scores.happy -= 2;
      }
    }

    function getMoodRankings(scores) {
      return Object.entries(scores)
        .filter(([, score]) => Number.isFinite(score) && score > 0)
        .sort((a, b) => b[1] - a[1])
        .map(([mood, score]) => ({ mood, score }));
    }

    function getBestMood(scores) {
      const rankings = getMoodRankings(scores);
      const best = rankings[0];

      if (!best) {
        return "neutral";
      }

      // neutralは「本当に材料が少ない時」だけにする。
      // 前の版はhappyを厳しく落としすぎて、neutralが多くなっていた。
      if (best.score < 2) {
        return "neutral";
      }

      return best.mood;
    }

    function formatMoodRankings(rankings) {
      if (!rankings || rankings.length === 0) {
        return "main mood: neutral";
      }

      const topThree = rankings.slice(0, 3);
      const labels = topThree.map((item) => {
        const poem = poemDatabase[item.mood];
        const label = poem?.label || item.mood;
        return label.split(" / ")[0];
      });

      const first = topThree[0];
      const second = topThree[1];

      if (second && first.score - second.score <= 3) {
        return `mixed mood: ${labels.join(" / ")}`;
      }

      return `main mood: ${labels[0]}${labels.length > 1 ? "   sub: " + labels.slice(1).join(" / ") : ""}`;
    }

    function judgeMoodFromTrackOnly(track) {
      const scores = createEmptyScores();
      const rules = getMoodRules();

      const trackText = [
        track.trackName,
        track.artistName,
        track.collectionName,
        track.primaryGenreName
      ]
        .filter(Boolean)
        .join(" ");

      addScoreByRules(scores, trackText, rules, 1);

      const genre = (track.primaryGenreName || "").toLowerCase();

      if (genre.includes("rock") || genre.includes("metal") || genre.includes("punk")) {
        scores.energy += 2;
      }

      if (genre.includes("dance") || genre.includes("electronic")) {
        scores.energy += 1;
        scores.city += 1;
      }

      if (genre.includes("jazz") || genre.includes("classical")) {
        scores.chill += 2;
      }

      const title = (track.trackName || "").toLowerCase();

      if (title.includes("happy") || title.includes("ハッピー")) {
        scores.happy += 0.5;
      }

      if (
        (title.includes("happy") || title.includes("ハッピー")) &&
        (scores.dark >= 3 || scores.lonely >= 3)
      ) {
        scores.dark += 3;
        scores.happy -= 2;
      }

      return {
        mood: getBestMood(scores),
        scores
      };
    }

    function judgeMoodFromLyrics(track, lyricsText) {
      const scores = createEmptyScores();
      const rules = getMoodRules();

      const trackText = [
        track.trackName,
        track.artistName,
        track.collectionName,
        track.primaryGenreName
      ]
        .filter(Boolean)
        .join(" ");

      const lyrics = cleanLyricsText(lyricsText);

      addScoreByRules(scores, trackText, rules, 1);
      addScoreByRules(scores, lyrics, rules, 3);

      const combined = `${trackText} ${lyrics}`.toLowerCase();

      if (
        combined.includes("happy") ||
        combined.includes("ハッピー") ||
        combined.includes("笑")
      ) {
        scores.happy += 1;
      }

      if (
        (combined.includes("happy") || combined.includes("ハッピー")) &&
        (scores.dark >= 6 || scores.lonely >= 5)
      ) {
        scores.dark += 4;
        scores.happy -= 3;
      }

      if (
        (combined.includes("笑") || combined.includes("smile")) &&
        (combined.includes("嘘") || combined.includes("痛") || combined.includes("泣"))
      ) {
        scores.dark += 3;
      }

      if (
        combined.includes("夜") &&
        (combined.includes("東京") || combined.includes("街") || combined.includes("ネオン"))
      ) {
        scores.city += 3;
        scores.dark += 1;
      }

      if (
        combined.includes("雨") &&
        (combined.includes("恋") || combined.includes("愛") || combined.includes("君"))
      ) {
        scores.love += 1;
        scores.dark += 2;
      }

      if (
        combined.includes("雨") &&
        (combined.includes("別れ") || combined.includes("さよなら") || combined.includes("会えない"))
      ) {
        scores.rain += 2;
        scores.heartbreak += 3;
      }

      if (
        combined.includes("冬") &&
        (combined.includes("別れ") || combined.includes("君") || combined.includes("会えない"))
      ) {
        scores.winter += 2;
        scores.heartbreak += 2;
      }

      if (
        (combined.includes("真夜中") || combined.includes("眠れない") || combined.includes("深夜")) &&
        (combined.includes("部屋") || combined.includes("時計"))
      ) {
        scores.midnight += 3;
      }

      if (
        (combined.includes("かわいい") || combined.includes("cute") || combined.includes("happy") || combined.includes("ハッピー")) &&
        (combined.includes("嘘") || combined.includes("痛") || combined.includes("壊") || combined.includes("嫌い"))
      ) {
        scores.dark += 3;
        scores.fragile += 2;
        scores.happy -= 2;
        scores.playful -= 2;
      }

      if (
        (combined.includes("東京") || combined.includes("街") || combined.includes("ネオン")) &&
        (combined.includes("真夜中") || combined.includes("夜") || combined.includes("深夜"))
      ) {
        scores.city += 3;
        scores.midnight += 2;
      }

      if (
        (combined.includes("走") || combined.includes("drive") || combined.includes("高速")) &&
        (combined.includes("夜") || combined.includes("街灯") || combined.includes("road"))
      ) {
        scores.drive += 3;
        scores.city += 1;
      }

      if (
        (combined.includes("大丈夫") || combined.includes("休") || combined.includes("息")) &&
        (combined.includes("疲") || combined.includes("泣") || combined.includes("痛"))
      ) {
        scores.healing += 3;
        scores.fragile += 1;
      }

      return {
        mood: getBestMood(scores),
        scores
      };
    }

    function chooseBestLyricsRecord(records, track) {
      if (!records || records.length === 0) {
        return null;
      }

      const trackName = (track.trackName || "").toLowerCase();
      const artistName = (track.artistName || "").toLowerCase();

      const scored = records.map((record) => {
        let score = 0;

        const recordTrack = (record.trackName || "").toLowerCase();
        const recordArtist = (record.artistName || "").toLowerCase();

        if (recordTrack === trackName) score += 5;
        if (recordTrack.includes(trackName) || trackName.includes(recordTrack)) score += 2;
        if (recordArtist === artistName) score += 5;
        if (recordArtist.includes(artistName) || artistName.includes(recordArtist)) score += 2;

        if (record.plainLyrics) score += 2;
        if (record.syncedLyrics) score += 1;

        return {
          record,
          score
        };
      });

      scored.sort((a, b) => b.score - a.score);

      return scored[0].record;
    }

    async function fetchLyricsForTrack(track) {
      const params = new URLSearchParams({
        track_name: track.trackName || "",
        artist_name: track.artistName || ""
      });

      const url = `https://lrclib.net/api/search?${params.toString()}`;

      try {
        const response = await fetch(url, {
          headers: {
            "Accept": "application/json"
          }
        });

        if (!response.ok) {
          return {
            lyrics: "",
            found: false,
            message: "歌詞検索は失敗しました。曲情報だけで判定しました。"
          };
        }

        const records = await response.json();
        const bestRecord = chooseBestLyricsRecord(records, track);

        if (!bestRecord) {
          return {
            lyrics: "",
            found: false,
            message: "歌詞は見つかりませんでした。曲情報だけで判定しました。"
          };
        }

        const lyrics = bestRecord.plainLyrics || bestRecord.syncedLyrics || "";

        if (!lyrics) {
          return {
            lyrics: "",
            found: false,
            message: "歌詞データが空でした。曲情報だけで判定しました。"
          };
        }

        return {
          lyrics,
          found: true,
          message: "歌詞を判定に使用しました。本文は表示していません。"
        };
      } catch (error) {
        console.error(error);

        return {
          lyrics: "",
          found: false,
          message: "歌詞検索中にエラーが起きました。曲情報だけで判定しました。"
        };
      }
    }

    async function fetchLastFmTagsForTrack(track) {
      const apiKey = LASTFM_API_KEY.trim();

      if (!apiKey || apiKey === "") {
        return {
          tags: [],
          found: false,
          message: "Last.fmタグは未設定です。APIキーを入れると補助判定できます。"
        };
      }

      const params = new URLSearchParams({
        method: "track.getTopTags",
        artist: track.artistName || "",
        track: track.trackName || "",
        api_key: apiKey,
        format: "json",
        autocorrect: "1"
      });

      const url = `https://ws.audioscrobbler.com/2.0/?${params.toString()}`;

      try {
        const response = await fetch(url);

        if (!response.ok) {
          return {
            tags: [],
            found: false,
            message: "Last.fmタグ取得に失敗しました。"
          };
        }

        const data = await response.json();
        const rawTags = data?.toptags?.tag || [];
        const tags = Array.isArray(rawTags) ? rawTags.slice(0, 12) : [];

        if (tags.length === 0) {
          return {
            tags: [],
            found: false,
            message: "Last.fmタグは見つかりませんでした。"
          };
        }

        return {
          tags,
          found: true,
          message: `Last.fmタグを補助判定に使用しました: ${tags.slice(0, 5).map((tag) => tag.name).join(" / ")}`
        };
      } catch (error) {
        console.error(error);
        return {
          tags: [],
          found: false,
          message: "Last.fmタグ取得中にエラーが起きました。"
        };
      }
    }

    async function searchMusic() {
      const input = document.getElementById("song-input").value.trim();

      hideError();

      if (!input) {
        showError("曲名かアーティスト名を入れてください。");
        return;
      }

      document.getElementById("main-ui").style.display = "none";
      document.getElementById("loading-ui").style.display = "block";
      document.getElementById("result-ui").style.display = "none";

      try {
        const url =
          "https://itunes.apple.com/search" +
          `?term=${encodeURIComponent(input)}` +
          "&country=JP" +
          "&media=music" +
          "&entity=song" +
          "&limit=1";

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("曲の情報取得に失敗しました。");
        }

        const data = await response.json();

        if (!data.results || data.results.length === 0) {
          throw new Error("曲が見つかりませんでした。別のキーワードで試してください。");
        }

        const track = data.results[0];
        const lyricsResult = await fetchLyricsForTrack(track);
        const lastFmResult = await fetchLastFmTagsForTrack(track);

        let moodResult;

        if (lyricsResult.found) {
          moodResult = judgeMoodFromLyrics(track, lyricsResult.lyrics);
          addScoreByLastFmTags(moodResult.scores, lastFmResult.tags, 2);
        } else {
          moodResult = judgeMoodFromTrackOnly(track);
          addScoreByLastFmTags(moodResult.scores, lastFmResult.tags, 4);

          if (!lastFmResult.found) {
            Object.keys(moodResult.scores).forEach((key) => {
              if (key !== "neutral") moodResult.scores[key] *= 0.55;
            });
          }
        }

        const correctionText = [
          track.trackName,
          track.artistName,
          track.collectionName,
          track.primaryGenreName,
          lyricsResult.found ? lyricsResult.lyrics : "",
          lastFmResult.tags.map((tag) => tag.name).join(" "),
          input
        ].join(" ");

        applyGeneralMoodCorrections(moodResult.scores, correctionText);

        const rankings = getMoodRankings(moodResult.scores);
        const mood = getBestMood(moodResult.scores);
        const selectedPoem = poemDatabase[mood] || poemDatabase.neutral || poemDatabase.happy;
        const moodLabel = formatMoodRankings(rankings);

        document.body.style.background = selectedPoem.bg;

        document.getElementById("music-jacket").src = getLargeArtwork(track.artworkUrl100);
        document.getElementById("res-song-title").innerText = track.trackName || "曲名不明";
        document.getElementById("res-artist-name").innerText = track.artistName || "アーティスト不明";
        document.getElementById("res-album-name").innerText = track.collectionName || "アルバム不明";

        document.getElementById("res-music-review").innerText = selectedPoem.review;
        document.getElementById("mood-badge").innerText = moodLabel;
        document.getElementById("lyrics-status").innerText = `${lyricsResult.message} / ${lastFmResult.message}`;

        document.getElementById("res-poem-body").innerText = selectedPoem.body;
        document.getElementById("res-poem-title").innerText = selectedPoem.title;
        document.getElementById("res-poem-author").innerText = selectedPoem.author;
        document.getElementById("res-poem-review").innerText = selectedPoem.poem_review;

        const audio = document.getElementById("preview-audio");

        if (track.previewUrl) {
          audio.src = track.previewUrl;
          audio.style.display = "block";
        } else {
          audio.pause();
          audio.removeAttribute("src");
          audio.style.display = "none";
        }

        const musicLink = document.getElementById("music-link");
        musicLink.href = track.trackViewUrl || track.collectionViewUrl || "#";

        document.getElementById("loading-ui").style.display = "none";
        document.getElementById("result-ui").style.display = "block";
      } catch (error) {
        console.error(error);

        document.getElementById("loading-ui").style.display = "none";
        document.getElementById("main-ui").style.display = "block";

        showError(error.message || "エラーが起きました。");
      }
    }

    function resetApp() {
      document.body.style.background = "#121212";

      document.getElementById("song-input").value = "";
      document.getElementById("result-ui").style.display = "none";
      document.getElementById("loading-ui").style.display = "none";
      document.getElementById("main-ui").style.display = "block";

      const audio = document.getElementById("preview-audio");
      audio.pause();
      audio.removeAttribute("src");

      hideError();
    }

  </script>
